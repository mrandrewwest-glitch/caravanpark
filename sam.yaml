AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OnSite - AI phone receptionist (Dialpad webhook -> API Gateway -> Lambda)

Parameters:
  PortalFromEmail:
    Type: String
    Description: SES-verified address the owner portal sends sign-in codes from
  AnthropicSecretArn:
    Type: String
    Description: Secrets Manager secret whose value is the Anthropic API key
  ParkId:
    Type: String
    Default: friend-caravan-park
  AlarmEmail:
    Type: String
    Description: Email notified when the error alarm fires

Resources:
  ReceptionistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: lambda.handler
      CodeUri: .
      MemorySize: 512
      Timeout: 10   # the app enforces its own 2.8s per-turn budget (TURN_DEADLINE_MS)
      # Production requires the DynamoDB store (lambda.js refuses to start on the in-memory one).
      Environment:
        Variables:
          NODE_ENV: production          # disables /test-call
          PARKS_CONFIG: parks.json      # per-park config shipped with the package (see parks.example.json)
          STORE_BACKEND: dynamodb
          DYNAMODB_TABLE: !Ref OnSiteTable
          CLAUDE_MODE: live
          ANTHROPIC_SECRET_ARN: !Ref AnthropicSecretArn
          PARK_ID: !Ref ParkId
          PORTAL_FROM_EMAIL: !Ref PortalFromEmail   # must be an SES-verified sender
          TRUST_PROXY: '1'                          # behind API Gateway: real client IP for sign-in rate limits
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AnthropicSecretArn
        - DynamoDBCrudPolicy:
            TableName: !Ref OnSiteTable
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: '*'
      Events:
        PortalPages:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /portal/{proxy+}
            Method: ANY
        PortalRoot:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /portal
            Method: ANY
        PhoneCallback:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /phone-callback
            Method: POST
        CallEnded:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /call-ended
            Method: POST
        PaymentWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /payment-webhook
            Method: POST
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /health
            Method: GET

  # Hold expiry + call finalisation. The /admin routes are deliberately NOT exposed through API
  # Gateway; add an authenticated admin surface before letting parks change settings themselves.
  JobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: lambda.jobsHandler
      CodeUri: .
      MemorySize: 512
      Timeout: 60
      Environment:
        Variables:
          NODE_ENV: production
          PARKS_CONFIG: parks.json
          STORE_BACKEND: dynamodb
          DYNAMODB_TABLE: !Ref OnSiteTable
          ANTHROPIC_SECRET_ARN: !Ref AnthropicSecretArn
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AnthropicSecretArn
        - DynamoDBCrudPolicy:
            TableName: !Ref OnSiteTable
      Events:
        Every5Minutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: 100
          ThrottlingBurstLimit: 200

  # One table for everything (see dynamo-store.js / repos.js). Holds held bookings, call state, the
  # billing ledger and park settings, so it is RETAINED if the stack is deleted.
  OnSiteTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
        - { AttributeName: gsi2pk, AttributeType: S }
        - { AttributeName: gsi2sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: gsi1   # held bookings by hold expiry; open calls by last activity
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: gsi2   # calls per park by start time (monthly statements)
          KeySchema:
            - { AttributeName: gsi2pk, KeyType: HASH }
            - { AttributeName: gsi2sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors above 5% of invocations
      Metrics:
        - Id: rate
          Expression: 100 * errors / MAX([errors, invocations])
          Label: ErrorRatePercent
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref ReceptionistFunction }] }
            Period: 300
            Stat: Sum
        - Id: invocations
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Invocations, Dimensions: [{ Name: FunctionName, Value: !Ref ReceptionistFunction }] }
            Period: 300
            Stat: Sum
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

Outputs:
  TableName:
    Value: !Ref OnSiteTable
  PhoneCallbackUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod/phone-callback
